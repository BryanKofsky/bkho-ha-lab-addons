name: BKHO Bootstrap Agent Remote Control Lab Proof
version: 0.1.21-remote-control-lab
slug: bkho_bootstrap_agent
description: Lab-only V-001 outbound control proof for BKHO. Not for production bootstrap.
url: https://github.com/BryanKofsky/bkho-ha-lab-addons
arch:
  - aarch64
  - amd64
startup: services
boot: manual
init: false
host_network: true
full_access: false
docker_api: false
hassio_api: false
homeassistant_api: false
apparmor: true
options:
  control_mode: "outbound_https_poll"
  control_endpoint_url: ""
  claim_poll_seconds: 10
schema:
  control_mode: "list(outbound_https_poll)"
  control_endpoint_url: url?
  claim_poll_seconds: "int(5,60)"
